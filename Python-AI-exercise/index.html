<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Remover</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f7f7f7;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .row {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .panel {
      flex: 1;
      min-width: 280px;
    }
    img {
      max-width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: gray;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Remove Image Background</h2>
    <input type="file" id="fileInput" accept="image/*" />
    <br />
    <button id="submitBtn" onclick="uploadImage()">Remove Background</button>

    <div class="row">
      <div class="panel">
        <h3>Original</h3>
        <img id="previewImage" />
      </div>
      <div class="panel">
        <h3>Result</h3>
        <img id="resultImage" />
        <br />
        <a id="downloadLink" download="output.png" style="display:none;">Download PNG</a>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const previewImage = document.getElementById("previewImage");
    const resultImage = document.getElementById("resultImage");
    const downloadLink = document.getElementById("downloadLink");
    const submitBtn = document.getElementById("submitBtn");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (file) {
        previewImage.src = URL.createObjectURL(file);
      }
    });

    async function uploadImage() {
      const file = fileInput.files[0];
      if (!file) {
        alert("Choose an image first.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("http://127.0.0.1:8000/remove-bg", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error("Upload failed");
        }

        const blob = await response.blob();
        const imageUrl = URL.createObjectURL(blob);

        resultImage.src = imageUrl;
        downloadLink.href = imageUrl;
        downloadLink.style.display = "inline-block";
      } catch (error) {
        alert("Error: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Remove Background";
      }
    }
  </script>
</body>
</html>
